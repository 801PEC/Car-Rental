<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TickTick Clone</title>
    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #eef2f6;
            background-image:
                radial-gradient(at 0% 100%, hsla(253, 16%, 7%, 1) 0, transparent 50%),
                radial-gradient(at 50% 100%, hsla(225, 39%, 30%, 1) 0, transparent 50%),
                radial-gradient(at 100% 100%, hsla(339, 49%, 30%, 1) 0, transparent 50%);
            background-size: cover;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .auth-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--text-main), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .auth-input {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.8);
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }

        .auth-input:focus {
            background: white;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        .auth-switch {
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .auth-switch span#switchAction {
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
        }

        .auth-switch span#switchAction:hover {
            text-decoration: underline;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="glass-panel auth-card">
        <h2 class="auth-title" id="authTitle">Welcome Back</h2>
        <p class="auth-subtitle">Manage your life with focus and style.</p>

        <input type="text" id="usernameInput" placeholder="Username" class="auth-input">
        <input type="password" id="passwordInput" placeholder="Password" class="auth-input">

        <button class="auth-btn" onclick="handleAuth()">Login</button>

        <p class="auth-switch">
            <span id="switchText">New here? </span>
            <span id="switchAction" onclick="toggleAuthMode()">Sign Up</span>
        </p>
    </div>

    <script>
        const API_USERS = '/api/users';
        let isLoginMode = true;

        if (localStorage.getItem('currentUser')) {
            window.location.href = 'index.html';
        }

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerText = isLoginMode ? 'Welcome Back' : 'Create Account';
            document.getElementById('switchText').innerText = isLoginMode ? 'New here? ' : 'Already have an account? ';
            document.getElementById('switchAction').innerText = isLoginMode ? 'Sign Up' : 'Login';
            document.querySelector('.auth-btn').innerText = isLoginMode ? 'Login' : 'Sign Up';
        }

        async function handleAuth() {
            const user = document.getElementById('usernameInput').value;
            const pass = document.getElementById('passwordInput').value;

            if (!user || !pass) {
                alert("Please fill all fields");
                return;
            }

            const endpoint = isLoginMode ? '/login' : '/register';

            try {
                const res = await fetch(`${API_USERS}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                if (!res.ok) throw new Error("Auth failed");

                const data = await res.json();
                if (data && data.id) {
                    localStorage.setItem('currentUser', JSON.stringify(data));
                    window.location.href = 'index.html';
                } else {
                    alert("Login failed");
                }
            } catch (e) {
                alert(e.message);
            }
        }
    </script>
</body>

</html>
